[project]
name = "mcp_finance"
version = "0.1.0"
description = "A standalone finance MCP repo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings",
    "mcp",
    "structlog",
    "httpx",
    "uvicorn",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "yfinance==1.7.0",
    "tenacity>=8.2,<10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",
    "mypy",
    "pytest",
    "pre-commit",
    "respx",
    "testcontainers[postgres]",
    "pytest-asyncio",
    "pandas-stubs",
]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_untyped_decorators = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: marks tests as isolated unit tests",
    "integration: marks tests as live integration tests requiring network/credentials",
]
