services:
  mcp-finance:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # ports:
    #   - "8000:8000" # Uncomment if exposing via HTTP

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_finance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
